<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Crisp emerald gradient matching Fidela brand identity -->
    <linearGradient id="fidela-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="f-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Subtle focal point drop shadow -->
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <radialGradient id="dot-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#bef264" />
      <stop offset="70%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Crisp Vector Emblem (Centered, no radioactive blur) -->
  <g transform="translate(252, 252)" filter="url(#subtle-shadow)">
    <!-- Outer Viewfinder Corner Brackets (stroke width 40, rounded ends) -->
    <!-- Top-Left Corner -->
    <path d="M 170 30 L 70 30 A 40 40 0 0 0 30 70 L 30 170" fill="none" stroke="url(#fidela-stroke)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Top-Right Corner -->
    <path d="M 350 30 L 450 30 A 40 40 0 0 1 490 70 L 490 170" fill="none" stroke="url(#fidela-stroke)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bottom-Left Corner -->
    <path d="M 30 350 L 30 450 A 40 40 0 0 0 70 490 L 170 490" fill="none" stroke="url(#fidela-stroke)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bottom-Right Corner -->
    <path d="M 350 490 L 450 490 A 40 40 0 0 0 490 450 L 490 350" fill="none" stroke="url(#fidela-stroke)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Stylized Geometric 'F' -->
    <path d="M 130 120 L 350 120 A 18 18 0 0 1 368 138 L 368 162 A 18 18 0 0 1 350 180 L 222 180 L 222 230 L 310 230 A 16 16 0 0 1 326 246 L 326 270 A 16 16 0 0 1 310 286 L 222 286 L 222 390 A 18 18 0 0 1 204 408 L 148 408 A 18 18 0 0 1 130 390 Z" 
          fill="none" 
          stroke="url(#f-stroke)" 
          stroke-width="36" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Diagonal Accent Line on F (as seen in original logo) -->
    <path d="M 130 260 L 210 180" stroke="url(#f-stroke)" stroke-width="34" stroke-linecap="round" />

    <!-- Studio Camera Focal Point Dot (Bottom Right, clean & sharp) -->
    <circle cx="490" cy="490" r="32" fill="url(#dot-gradient)" />
    <circle cx="490" cy="490" r="16" fill="#a3e635" />
    <circle cx="490" cy="490" r="8" fill="#ffffff" />
  </g>
</svg>
